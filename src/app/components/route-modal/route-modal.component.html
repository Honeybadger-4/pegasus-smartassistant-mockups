<div id="route-details-modal">
  <p-dialog
    [(visible)]="visible"
    [modal]="true"
    [closable]="true"
    [dismissableMask]="true"
    header="Route Details"
    [style]="{ width: '1200px' }"
    (onHide)="closeModal()"
  >
    <ng-template #noteStatusTemplate let-rowData="rowData" let-col="col">
      <i
        class="pi"
        [ngClass]="
          rowData.note
            ? 'pi-check-circle text-green-500'
            : 'pi-circle text-gray-300'
        "
      ></i>
      <span *ngIf="rowData.note" class="ml-2">
        {{ rowData.note }}
      </span>
    </ng-template>

    <!-- Route Details Table -->
    <section class="table-section custom-card mt-5">
      <app-custom-table
        [tableData]="routeData()"
        [tableColumns]="routeDetailsModalColumns"
        [tableLoading]="tableLoading()"
        [isPaginator]="false"
      ></app-custom-table>
    </section>

    <!-- Alternate Route Details Title -->
    <h4 class="mt-6 mb-2">Alternate Route Details</h4>

    <!-- Alternate Route Details Table -->
    <section class="table-section custom-card">
      <ng-container *ngIf="alternateRouteData() && alternateRouteData().length > 0; else noAlternate">
        <app-custom-table
          [tableData]="alternateRouteData()"
          [tableColumns]="routeDetailsModalColumns"
          [tableLoading]="tableLoading()"
          [isPaginator]="false"
        ></app-custom-table>
      </ng-container>
      <ng-template #noAlternate>
        <p class="text-gray-500 text-sm">No alternate route(s) available !</p>
      </ng-template>
    </section>
  </p-dialog>
</div>
