<div id="top-alternate-routes-card-component">
  <div class="card-placeholder">
    <p class="title">Top 5 Most Used Alternate Routes ({{ titleSuffix() }})</p>

    <div class="table-box">
      <ng-container *ngIf="alternateRoutes().length > 0; else noData">
        <p-table [value]="alternateRoutes()" class="custom-table">
          <ng-template pTemplate="header">
            <tr>
              <th>Route</th>
              <th>From-To</th>
              <th>Count</th>
            </tr>
          </ng-template>
          <ng-template pTemplate="body" let-row>
            <tr>
              <td>{{ row.airportICAOCode }}</td>
              <td>{{ row.depPort }} - {{ row.arrPort }}</td>
              <td>{{ row.frequency }}</td>
            </tr>
          </ng-template>
        </p-table>
      </ng-container>

      <ng-template #noData>
        <div class="no-data-message">
          Sorry, there is no alternative route data for this time period.
        </div>
      </ng-template>
    </div>
  </div>
</div>
