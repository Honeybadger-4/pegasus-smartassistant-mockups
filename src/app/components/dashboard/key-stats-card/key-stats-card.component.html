<div id="key-stats-card-component">
  <div class="card-placeholder">
    <p class="title">Key Stats ({{ titleSuffix() }})</p>

    <div class="stats-box">
      <ng-container *ngIf="rawStats() as stats; else noData">
        <div class="stat">
          <div class="value">{{ stats.totalFlightHours }}</div>
          <div class="label mb-3">Total Flight Time</div>

          <div class="value">{{ stats.gpsLossForm }}</div>
          <div class="label mb-3">GPS Loss Form Created</div>

          <div class="value">{{ stats.flightPlans }}</div>
          <div class="label">Flight Plan Created</div>
        </div>
      </ng-container>

      <ng-template #noData>
        <div class="no-data-message">
          Sorry, there is no statistical data for this time period.
        </div>
      </ng-template>
    </div>
  </div>
</div>
