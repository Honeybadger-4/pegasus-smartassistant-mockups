<div id="gps-signal-loss-card-component">
  <div class="card-placeholder">
    <p class="title">GPS Signal Loss Breakdown by Type ({{ titleSuffix() }})</p>

    <div class="chart-box">
      <ng-container *ngIf="types().length > 0; else noData">
        <div class="chart-area">
          <app-custom-donut-chart
            [data]="chartData()"
            [options]="chartOptions()"
          ></app-custom-donut-chart>
        </div>

        <div class="legend-area">
          <div class="legend-item" *ngFor="let item of types(); let i = index">
            <span
              class="dot"
              [ngStyle]="{ 'background-color': item.color }"
            ></span>
            <div>
              <div class="value">{{ item.value }}</div>
              <div class="label">{{ item.label }}</div>
            </div>
          </div>
        </div>
      </ng-container>

      <ng-template #noData>
        <div class="no-data-message">
          Sorry, there is no GPS signal loss data for this time period.
        </div>
      </ng-template>
    </div>
  </div>
</div>
