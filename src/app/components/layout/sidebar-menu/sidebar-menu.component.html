<div id="LayoutSidebarMenu">
  <ng-container *ngIf="!isMobile; else mobileMenuTemplate">
    <div class="sidebar-menu-container">
      <!-- Menu Content -->
      <div class="sidebar-menu-content">
        @for (menuItem of menuItems; track $index) {
          <div class="menu-item-container">
            <a
              pRipple
              class="menu-item w-full"
              routerLink="/{{ menuItem.path }}"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
            >
              <img
                src="/icons/{{ menuItem.icon }}"
                alt="{{ menuItem.label }}"
                class="icon-class"
              />
              <span>{{ menuItem.label }}</span>
            </a>
          </div>
        }
      </div>
    </div>
  </ng-container>

  <!-- Mobile Sidebar Menu -->
   <ng-template #mobileMenuTemplate>
     <div class="mobile-sidebar-menu-container">
      <div class="mb-5">
        <img
          src="/images/pegasus_logo.svg"
          alt="Pegasus Logo"
          class="pegasus-logo"
        />
      </div>
       <!-- Menu Content -->
       <div class="mobile-sidebar-menu-content">
         @for (menuItem of menuItems; track $index) {
           <div class="mobile-menu-item-container">
             <a
               pRipple
               class="mobile-menu-item w-full"
               routerLink="/{{ menuItem.path }}"
               routerLinkActive="active"
               [routerLinkActiveOptions]="{ exact: true }"
             >
               <img
                 src="/icons/{{ menuItem.icon }}"
                 alt="{{ menuItem.label }}"
                 class="icon-class"
               />
               <span>{{ menuItem.label }}</span>
             </a>
           </div>
         }
       </div>
     </div>
   </ng-template>
  
</div>
