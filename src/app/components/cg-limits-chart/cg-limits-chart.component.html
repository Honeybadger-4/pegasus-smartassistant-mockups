<section>
  @if (chartLoading()) {
    <div class="flex justify-center">
      <p-progress-spinner
        strokeWidth="4"
        fill="transparent"
        animationDuration=".5s"
        ariaLabel="loading"
        [style]="{ width: '100px', height: '100px' }"
      />
    </div>
  } @else {
    <p-chart type="scatter" [data]="chartData()" [options]="chartOptions" />
  }
</section>
