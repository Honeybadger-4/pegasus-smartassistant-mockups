<p-dialog
  [(visible)]="visible"
  (onHide)="onClose()"
  [modal]="true"
  [dismissableMask]="true"
  [style]="{ width: '80vw', height: '80vh' }"
  header="{{ pdfData?.FILE_NAME || 'Flight Plan' }}"
>
  <ng-container *ngIf="pdfSrc">
    <iframe
      [src]="pdfSrc"
      width="100%"
      height="100%"
      type="application/pdf"
      style="border: none;"
    ></iframe>
  </ng-container>
</p-dialog>
