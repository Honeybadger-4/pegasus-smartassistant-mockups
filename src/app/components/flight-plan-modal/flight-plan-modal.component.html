<div id="flight-plan-modal">
  <p-dialog
    [(visible)]="visible"
    (onHide)="onClose()"
    [modal]="true"
    [dismissableMask]="true"
    [style]="{ width: '1200px', height: '800px' }"
    header="{{ pdfData?.FILE_NAME || 'Flight Plan' }}"
  >
    <ng-container *ngIf="pdfSrc">
      <iframe [src]="pdfSrc" class="pdf-iframe" type="application/pdf">
      </iframe>
    </ng-container>
  </p-dialog>
</div>
