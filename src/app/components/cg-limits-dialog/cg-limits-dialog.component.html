<section id="cg-limits-dialog-component">
  <p-dialog
    [(visible)]="visible"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }"
    [style]="{ width: '80vw' }"
    (onHide)="close()"
  >
    <ng-template pTemplate="header">
      <div class="flex items-center justify-between w-full">
        <h2 class="text-lg font-semibold">CG Limits</h2>
      </div>
    </ng-template>

    <div>
      <app-cg-limits-chart
        [legIsn]="selectedRowData()?.id"
      ></app-cg-limits-chart>
    </div>
  </p-dialog>
</section>
