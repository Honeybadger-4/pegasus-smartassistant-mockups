<div class="custom-breadcrumb-component">
  <p-breadcrumb class="max-w-full" [model]="breadCrumbItems">
    <ng-template pTemplate="item" let-item>
      <a
        *ngIf="item.routerLink" 
        [routerLink]="item.routerLink"
        class="p-menuitem-link"
      >
        <span class="item-text font-bold">{{ item.label }}</span>
      </a>
      <span *ngIf="!item.routerLink" class="item-text font-bold">
        {{ item.label }}
      </span>
    </ng-template>
  </p-breadcrumb>
</div>
