<div id="custom-table-component">
  <p-table
    #table
    [value]="tableData()"
    [columns]="tableColumns()"
    [loading]="tableLoading()"
    [lazy]="true"
    [paginator]="isPaginator()"
    [rows]="rows"
    [first]="0"
    [totalRecords]="totalRecords()"
    [rowsPerPageOptions]="[20, 40, 80]"
    [selectionMode]="selectionMode()"
    [(selection)]="selectionData"
    (selectionChange)="selectionChange($event)"
    stripedRows
    (onLazyLoad)="onLazyLoad($event)"
  >
    <!-- Table Header -->
    <ng-template #header let-columns>
      <tr>
        <th *ngIf="selectionMode() === 'multiple'" style="width: 4rem">
          <p-tableHeaderCheckbox />
        </th>
        <th *ngFor="let col of columns">
          <div class="flex items-center" style="white-space: nowrap">
            {{ col.header }}
            <ng-container [ngSwitch]="col.filterType">
              <!-- Selectbox Filter -->
              <ng-container *ngSwitchCase="'selectbox'">
                <ng-container
                  *ngTemplateOutlet="
                    selectFilterTemplate;
                    context: { $implicit: col }
                  "
                />
              </ng-container>

              <!-- Datepicker Filter -->
              <ng-container *ngSwitchCase="'datepicker'">
                <ng-container
                  *ngTemplateOutlet="
                    dateFilterTemplate;
                    context: { $implicit: col }
                  "
                />
              </ng-container>

              <ng-container *ngSwitchCase="'timeonly'">
                <ng-container
                  *ngTemplateOutlet="
                    timeFilterTemplate;
                    context: { $implicit: col }
                  "
                />
              </ng-container>

              <!-- Default Text Filter -->
              <ng-container *ngSwitchDefault>
                <ng-container
                  *ngTemplateOutlet="
                    defaultFilterTemplate;
                    context: { $implicit: col }
                  "
                />
              </ng-container>
            </ng-container>
          </div>
        </th>
      </tr>
    </ng-template>

    <!-- Table Body -->
    <ng-template #body let-rowData>
      <tr>
        <td *ngIf="selectionMode() === 'multiple'">
          <p-tableCheckbox [value]="rowData" />
        </td>

        <td *ngFor="let column of tableColumns()">
          <ng-container *ngIf="column.template; else defaultCell">
            <ng-container
              *ngTemplateOutlet="column.template; context: { rowData: rowData }"
            ></ng-container>
          </ng-container>

          <ng-template #defaultCell>
            {{ rowData[column.field] || "-" }}
          </ng-template>
        </td>
      </tr>
    </ng-template>

    <ng-template #footer>
      <ng-container *ngTemplateOutlet="footerTemplate()"></ng-container>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="50">{{ noDataFoundMsg() }}</td>
      </tr>
    </ng-template>

    <!-- Filters Template -->
    <!-- Default Text Filter -->
    <ng-template #defaultFilterTemplate let-col>
      <ng-container *ngIf="col.isFilter">
        <p-columnFilter
          type="text"
          [field]="col.field"
          display="menu"
          matchMode="contains"
          [showMatchModes]="false"
          [showOperator]="false"
          [showAddButton]="false"
          [placeholder]="'Search by ' + col.header"
          ariaLabel="Filter"
        />
      </ng-container>
    </ng-template>

    <!-- Selectbox Template -->
    <ng-template #selectFilterTemplate let-col>
      <p-columnFilter
        [field]="col.field"
        matchMode="equals"
        display="menu"
        [showMatchModes]="false"
        [showOperator]="false"
        [showAddButton]="false"
        [showApplyButton]="false"
      >
        <ng-template #filter let-value let-filter="filterCallback">
          <p-select
            (ngModel)="(value)"
            [options]="col.filterOptions"
            styleClass="w-full"
            placeholder="Select One"
            (onChange)="filter($event.value)"
          >
            <ng-template let-option #item>
              <span>{{ option.label }}</span>
            </ng-template>
          </p-select>
        </ng-template>
      </p-columnFilter>
    </ng-template>

    <!-- Datepicker Template -->
    <ng-template #dateFilterTemplate let-col>
      <p-columnFilter
        [field]="col.field"
        matchMode="equals"
        display="menu"
        [showMatchModes]="false"
        [showOperator]="false"
        [showAddButton]="false"
        [showApplyButton]="false"
      >
        <ng-template #filter let-value let-filter="filterCallback">
          <p-datepicker
            [readonlyInput]="true"
            dateFormat="dd/mm/yy"
            placeholder="Select a Date"
            class="custom-calendar"
            (onSelect)="filter(filterDateControl($event))"
          />
        </ng-template>
      </p-columnFilter>
    </ng-template>

    <ng-template #timeFilterTemplate let-col>
      <p-columnFilter
        [field]="col.field"
        matchMode="equals"
        display="menu"
        [showMatchModes]="false"
        [showOperator]="false"
        [showAddButton]="false"
        [showApplyButton]="false"
      >
        <ng-template #filter let-value let-filter="filterCallback">
          <p-datepicker
            [readonlyInput]="true"
            [timeOnly]="true"
            [showSeconds]="false"
            placeholder="Select a Time"
            class="custom-calendar"
            (onSelect)="filter(filterTimeControl($event))"
          ></p-datepicker>
        </ng-template>
      </p-columnFilter>
    </ng-template>
  </p-table>
</div>
