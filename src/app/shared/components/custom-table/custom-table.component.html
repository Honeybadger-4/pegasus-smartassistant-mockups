<p-table
  #table
  [value]="tableData()"
  [columns]="tableColumns()"
  stripedRows
  [loading]="tableLoading()"
  [lazy]="lazy()"
  [paginator]="isPaginator()"
  [rows]="rows"
  [first]="0"
  [totalRecords]="totalRecords()"
  [rowsPerPageOptions]="[20, 40, 80]"
  [selectionMode]="selectionMode()"
  [(selection)]="selectionData"
  (selectionChange)="selectionChange($event)"
  (onPage)="pageChange($event)"
>
  <!-- Table Header -->
  <ng-template #header let-columns>
    <tr>
      <th *ngIf="selectionMode() === 'multiple'" style="width: 4rem">
        <p-tableHeaderCheckbox />
      </th>
      <th *ngFor="let col of columns">
        {{ col.header }}
      </th>
    </tr>
  </ng-template>

  <!-- Table Body -->
  <ng-template #body let-rowData>
    <tr (click)="rowClicked(rowData)">
      <td *ngIf="selectionMode() === 'multiple'">
        <p-tableCheckbox [value]="rowData" />
      </td>

      <td *ngFor="let column of tableColumns()">
        <ng-container *ngIf="column.template; else defaultCell">
          <ng-container
            *ngTemplateOutlet="column.template; context: { rowData: rowData }"
          ></ng-container>
        </ng-container>

        <ng-template #defaultCell>
          {{ rowData[column.field] || "-" }}
        </ng-template>
      </td>
    </tr>
  </ng-template>

  <ng-template #footer>
    <ng-container *ngTemplateOutlet="footerTemplate()"></ng-container>
  </ng-template>

  <ng-template #emptymessage>
    <tr>
      <td colspan="50">No data found.</td>
    </tr>
  </ng-template>
</p-table>
