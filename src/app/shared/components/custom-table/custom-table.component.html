<p-table
  [value]="tableData"
  [columns]="tableColumns"
  dataKey="id"
  [tableStyle]="{ 'min-width': '50rem' }"
  styleClass="p-datatable-striped"
  [paginator]="true"
  [rows]="20"
  [rowsPerPageOptions]="[20, 40, 80]"
  [selectionMode]="selectionMode"
  [(selection)]="selectionData"
  (selectionChange)="selectionChange($event)"
>
  <!-- Table Header -->
  <ng-template pTemplate="header" let-columns>
    <tr>
      <th *ngIf="selectionMode === 'multiple'" style="width: 4rem">
        <p-tableHeaderCheckbox />
      </th>
      <th *ngFor="let col of columns">
        {{ col.header }}
      </th>
    </tr>
  </ng-template>

  <!-- Table Body -->
  <ng-template pTemplate="body" let-rowData>
    <tr (click)="rowClicked(rowData)">
      <td *ngIf="selectionMode === 'multiple'">
        <p-tableCheckbox [value]="rowData" />
      </td>

      <td *ngFor="let column of tableColumns">
        <ng-container *ngIf="column.template; else defaultCell">
          <ng-container
            *ngTemplateOutlet="column.template; context: { rowData: rowData }"
          ></ng-container>
        </ng-container>

        <ng-template #defaultCell>
          {{ rowData[column.field] }}
        </ng-template>
      </td>
    </tr>
  </ng-template>
</p-table>
