<main id="loginPage" class="grid grid-cols-12 min-h-screen">

    <section class="left-section hidden lg:block col-span-7">
        <img src="/images/airplane.svg" alt="Airplane" class="airplane" />
    </section>

    <section class="right-section col-span-12 lg:col-span-5">

        <div class="login-form-container">
            
            <div class="title-group">
                <div class="flex justify-end w-full">
                    <img src="/images/pegasus_logo.svg" class="mb-3" />
                </div>
                <p class="sub-header">Electronic Flight Bag Administrator</p>
            </div>

            <div class="welcome-group">
                <h1>Welcome!</h1>
                <p>Enter your login credentials to get access</p>
            </div>

            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                <div class="form-inputs-group">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" formControlName="username"
                            placeholder="Enter your email address or username" pInputText />
                        @if (loginForm.get('username')?.invalid && loginForm.get('username')?.touched) {
                        <div class="error-text">Wrong username</div>
                        }
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" formControlName="password"
                            placeholder="Enter your password" pInputText />
                        @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
                        <div class="error-text">Wrong password</div>
                        }
                    </div>
                </div>

                <p-button type="submit" label="Sign in" class="sign-in-btn"></p-button>
            </form>
        </div>
    </section>
</main>
