<div id="load-sheet-page">
  <!-- Page Header -->
  <section class="flex items-center justify-between">
    <p class="header-title">Load Sheet</p>

    <div class="w-[210px]">
      <p-iconField iconPosition="right" class="custom-icon-field">
        <input
          type="text"
          pInputText
                    #searchInput

          [(ngModel)]="searchInputValue"
          (ngModelChange)="onChangeSearch($event)"
          placeholder="Find Aircraft or Flight No"
        />
        <p-inputIcon styleClass="pi pi-search"></p-inputIcon>
      </p-iconField>
    </div>
  </section>

  <!-- Table -->
  <section class="table-section custom-card mt-5">
  <app-custom-table
    [tableData]="loadSheetContentData()"
    [tableColumns]="columns()"
    [totalRecords]="loadSheetData()?.totalElements || 0"
    (lazyLoadEvent)="lazyLoadEvent($event)"
    [tableLoading]="tableLoading()"
  ></app-custom-table>
</section>

</div>


<!-- Status Chip Template -->
<ng-template #statusColumnTemplate let-rowData="rowData">
  @switch (rowData.status) {
    @case ("LOADSHEET_CREATED") {
      <p-chip label="Created" class="orange-chip" />
    }
    @case ("LOADSHEET_DELIVERED") {
      <p-chip label="Delivered" class="green-chip" />
    }
    @case ("LOADSHEET_APPROVED") {
      <p-chip label="Approved" class="light-green-chip" />
    }
    @case ("LOADSHEET_DECLINED") {
      <p-chip label="Declined" class="red-chip" />
    }
    @case ("LOADSHEET_REPLACED") {
      <p-chip label="Replaced" class="black-chip" />
    }
    @default {
      <p-chip label="{{ rowData.status || '-' }}" class="gray-chip" />
    }
  }
</ng-template>
