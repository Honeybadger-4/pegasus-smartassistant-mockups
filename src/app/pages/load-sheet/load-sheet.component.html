<main id="LoadSheetPage">
  <section class="table-header-section">
    <span class="header-title">Load Sheet</span>
    <p-dropdown
      [options]="periodOptions"
      [(ngModel)]="selectedPeriod"
      optionLabel="label"
      optionValue="value"
      class="custom-dropdown period-dropdown"
      placeholder="Daily"
    ></p-dropdown>
  </section>

  <section class="slider-section custom-card">
    <div class="slider-container">
      <p class="slider-title">Approved</p>
      <p-slider
        [(ngModel)]="approvedValue"
        disabled
        class="approved-slider"
        [ngStyle]="{ width: '100%' }"
      ></p-slider>
      <p class="percentage">{{ approvedValue }}%</p>
    </div>

    <div class="slider-container">
      <p class="slider-title">Declined</p>
      <p-slider
        [(ngModel)]="declinedValue"
        disabled
        class="declined-slider"
        [ngStyle]="{ width: '100%' }"
      ></p-slider>
      <p class="percentage">{{ declinedValue }}%</p>
    </div>
  </section>

  <section class="table-section custom-card">
    <app-custom-table
      [tableData]="loadSheetTableData()"
      [tableColumns]="columns"
    ></app-custom-table>
  </section>
</main>

<!-- Table Cell Templates -->
<ng-template #statusCellBodyTemplate let-rowData="rowData">
  <span class="font-bold">{{ rowData.status }}</span>
</ng-template>

<ng-template #previewCellBodyTemplate>
  <i class="pi pi-eye"></i>
</ng-template>

<ng-template #downloadCellBodyTemplate>
  <i class="pi pi-download"></i>
</ng-template>
