<main id="ReportPage">
  <section class="table-header-section">
    <span class="header-title">Report</span>
    <p-dropdown
      [options]="periodOptions"
      [(ngModel)]="selectedPeriod"
      optionLabel="label"
      optionValue="value"
      class="custom-dropdown period-dropdown"
      placeholder="Daily"
    ></p-dropdown>
  </section>

  <section class="table-section custom-card">
    <app-custom-table [tableData]="reportData" [tableColumns]="columns"></app-custom-table>
  </section>
</main>

<!-- Table Cell Templates -->
<ng-template #checkListCellBodyTemplate let-rowData="rowData">
  <span class="font-bold">{{rowData.checkList}}</span>
</ng-template>

<ng-template #previewCellBodyTemplate>
  <i class="pi pi-eye"></i>
</ng-template>

<ng-template #downloadCellBodyTemplate>
  <i class="pi pi-download"></i>
</ng-template>
