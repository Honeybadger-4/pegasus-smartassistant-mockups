<main id="ReportPage">
  <section class="table-header-section">
    <span class="header-title">Report</span>
    <p-dropdown
      [options]="periodOptions"
      [(ngModel)]="selectedPeriod"
      optionLabel="label"
      optionValue="value"
      class="custom-dropdown period-dropdown"
      placeholder="Daily"
    ></p-dropdown>
  </section>

  <section class="table-section custom-card">
    <p-table
      [value]="reportData"
      [columns]="columns"
      [paginator]="true"
      [rows]="5"
      [rowsPerPageOptions]="[5, 10, 20]"
      [tableStyle]="{ 'min-width': '50rem' }"
      styleClass="p-datatable-striped"
    >
      <ng-template pTemplate="header">
        <tr>
          <th *ngFor="let column of columns">{{ column.header }}</th>
          <th></th>
          <th></th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-rowData>
        <tr>
          <td>{{ rowData.aircraft }}</td>
          <td>{{ rowData.flightNo }}</td>
          <td>{{ rowData.departure }}</td>
          <td>{{ rowData.arrival }}</td>
          <td class="font-bold">{{ rowData.checklist }}</td>
          <td>{{ rowData.username }}</td>
          <td><i class="pi pi-eye"></i></td>
          <td><i class="pi pi-download"></i></td>
        </tr>
      </ng-template>
    </p-table>
  </section>
</main>
