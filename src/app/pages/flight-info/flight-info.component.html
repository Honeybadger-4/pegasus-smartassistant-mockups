<div id="FlightInfoComponent">
  <app-table-header></app-table-header>

  <p-table
    [value]="flightsData"
    [columns]="mainCols"
    dataKey="id"
    [tableStyle]="{'min-width': '50rem'}"
    styleClass="p-datatable-striped"
    [expandedRowKeys]="expandedRows"
    (onRowExpand)="onRowExpand($event)"
    (onRowCollapse)="onRowCollapse($event)"
    [paginator]="true"
    [rows]="5"
    [rowsPerPageOptions]="[5, 10, 20]"
  >
    <!-- Table Header -->
    <ng-template pTemplate="header" let-columns>
      <tr>
        <th></th>
        <th *ngFor="let col of columns">
          {{ col.header }}
        </th>
      </tr>
    </ng-template>

    <!-- Table Body -->
    <ng-template
      pTemplate="body"
      let-rowData
      let-columns="columns"
      let-expanded="expanded"
    >
      <tr>
        <td>
          <p-button
            type="button"
            pRipple
            [pRowToggler]="rowData"
            [text]="true"
            [rounded]="true"
            [plain]="true"
            [icon]="expanded ? 'pi pi-chevron-down' : 'pi pi-chevron-right'"
          />
        </td>

        <td *ngFor="let col of columns">
          {{ rowData[col.field] }}
        </td>
      </tr>
    </ng-template>

    <!-- Row Expansion Content -->
    <ng-template pTemplate="rowexpansion">
      <tr>
        <td colspan="12">
          <div>
            <p-tabView
              [(activeIndex)]="activeTabIndex"
              (activeIndexChange)="activeTabIndexChange($event)"
            >
              <p-tabPanel header="Crew">
                <ng-container *ngTemplateOutlet="expansionTable"></ng-container>
              </p-tabPanel>

              <p-tabPanel header="Flight Plan">
                <ng-container *ngTemplateOutlet="expansionTable"></ng-container>
              </p-tabPanel>

              <p-tabPanel header="Trip Info">
                <ng-container *ngTemplateOutlet="expansionTable"></ng-container>
              </p-tabPanel>

              <p-tabPanel header="Load Sheet">
                <ng-container *ngTemplateOutlet="expansionTable"></ng-container>
              </p-tabPanel>
            </p-tabView>
          </div>
        </td>
      </tr>
    </ng-template>    
  </p-table>
</div>

<ng-template #expansionTable>
  <div class="p-3">
    <p-table [value]="expandedTableData" [columns]="expandedTableColumns">
      <ng-template pTemplate="header" let-columns>
        <tr>
          <th *ngFor="let col of columns">
            {{ col.header }}
          </th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-rowData let-columns="columns">
        <tr>
          <td *ngFor="let col of columns">
            {{ rowData[col.field] }}
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="6">There are no order for this product yet.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</ng-template>
