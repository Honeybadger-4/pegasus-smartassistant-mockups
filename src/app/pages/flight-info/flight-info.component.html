<div id="FlightInfoComponent">
  <app-table-header></app-table-header>

  <section class="table-section custom-card">
    <p-table
      [value]="flightsData"
      [columns]="mainCols"
      dataKey="id"
      [tableStyle]="{ 'min-width': '50rem' }"
      styleClass="p-datatable-striped"
      [expandedRowKeys]="expandedRows"
      (onRowExpand)="onRowExpand($event)"
      (onRowCollapse)="onRowCollapse($event)"
      [paginator]="true"
      [rows]="20"
      [rowsPerPageOptions]="[20, 40, 80]"
    >
      <!-- Table Header -->
      <ng-template pTemplate="header" let-columns>
        <tr>
          <th></th>
          <th *ngFor="let col of columns">
            {{ col.header }}
          </th>
        </tr>
      </ng-template>

      <!-- Table Body -->
      <ng-template
        pTemplate="body"
        let-rowData
        let-columns="columns"
        let-expanded="expanded"
      >
        <tr>
          <td>
            <p-button
              type="button"
              pRipple
              [pRowToggler]="rowData"
              [text]="true"
              [rounded]="true"
              [plain]="true"
              [icon]="expanded ? 'pi pi-chevron-down' : 'pi pi-chevron-right'"
            />
          </td>

          <td *ngFor="let col of columns">
            {{ rowData[col.field] }}
          </td>
        </tr>
      </ng-template>

      <!-- Row Expansion Content -->
      <ng-template pTemplate="rowexpansion">
        <tr>
          <td colspan="12">
            <div>
              <p-tabView
                [(activeIndex)]="activeTabIndex"
                (activeIndexChange)="activeTabIndexChange($event)"
              >
                @for (item of tableSubPanels; track $index) {
                  <p-tabPanel header="{{ item.panelHeader }}">
                    <app-custom-table
                      [tableData]="item.tableData"
                      [tableColumns]="item.tableColumns"
                    ></app-custom-table>
                  </p-tabPanel>
                }
              </p-tabView>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </section>
</div>

<!-- Table Cell Templates -->
<ng-template #flightPlanTableFlightPlanCellTemplate let-rowData="rowData">
  <img
    src="/icons/document-view-icon.svg"
    alt="document view icon"
    class="icon-class"
  />
</ng-template>

  <img
    src="/icons/document-view-icon.svg"
    alt="document view icon"
    class="icon-class"
  />
</ng-template>

  <img
    src="/icons/document-view-icon.svg"
    alt="document view icon"
    class="icon-class"
  />
</ng-template>
