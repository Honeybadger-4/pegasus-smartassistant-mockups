<div id="FlightInfoComponent">
  <app-table-header></app-table-header>

  <section class="table-section custom-card">
    <p-table
      [value]="flightsData"
      [columns]="mainCols"
      dataKey="id"
      [tableStyle]="{ 'min-width': '50rem' }"
      styleClass="p-datatable-striped"
      [expandedRowKeys]="expandedRows"
      (onRowExpand)="onRowExpand($event)"
      (onRowCollapse)="onRowCollapse($event)"
      [paginator]="true"
      [rows]="20"
      [rowsPerPageOptions]="[20, 40, 80]"
    >
      <!-- Table Header -->
      <ng-template #header let-columns>
        <tr>
          <th></th>
          <th *ngFor="let col of columns">
            {{ col.header }}
          </th>
        </tr>
      </ng-template>

      <!-- Table Body -->
      <ng-template
        #body
        let-rowData
        let-columns="columns"
        let-expanded="expanded"
      >
        <tr>
          <td>
            <p-button
              type="button"
              pRipple
              [pRowToggler]="rowData"
              [text]="true"
              [rounded]="true"
              [plain]="true"
              [icon]="expanded ? 'pi pi-chevron-down' : 'pi pi-chevron-right'"
            />
          </td>

          <td *ngFor="let col of columns">
            {{ rowData[col.field] }}
          </td>
        </tr>
      </ng-template>

      <!-- Row Expansion Content -->
      <ng-template #expandedrow >
        <tr>
          <td colspan="12">
            <div>
              <p-tabs value="0">
                <p-tablist>
                    @for (tab of tableSubPanels; track tab.value) {
                        <p-tab [value]="tab.value">{{ tab.panelHeader }}</p-tab>
                    }
                </p-tablist>
                <p-tabpanels>
                    @for (tab of tableSubPanels; track tab.value) {
                        <p-tabpanel [value]="tab.value">
                          <app-custom-table
                            [tableData]="tab.tableData"
                            [tableColumns]="tab.tableColumns"
                          ></app-custom-table>
                        </p-tabpanel>
                    }
                </p-tabpanels>
              </p-tabs>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </section>
</div>

<!-- Table Cell Templates -->
<ng-template #flightPlanTableFlightPlanCellTemplate let-rowData="rowData">
  <i class="pi pi-eye icon-class"></i>
</ng-template>

<ng-template #tripInfoTableTripInfoCellTemplate let-rowData="rowData">
  <i class="pi pi-eye icon-class"></i>
</ng-template>

<ng-template #loadSheetTableLoadSheetCellTemplate let-rowData="rowData">
  <i class="pi pi-eye icon-class"></i>
</ng-template>

<ng-template #loadSheetTableCGLimitsCellTemplate let-rowData="rowData">
  <i class="pi pi-eye icon-class"></i>
</ng-template>
