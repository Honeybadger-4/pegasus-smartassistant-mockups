<div id="flight-plans-page">
  <!-- Page Header -->
  <section class="flex items-center justify-between">
    <p class="header-title">Flight Plans</p>

    <div class="w-[210px]">
      <p-iconField iconPosition="right" class="custom-icon-field">
        <input
          #searchInput
          type="text"
          pInputText
          [(ngModel)]="searchInputValue"
          (ngModelChange)="onChangeSearch($event)"
          placeholder="Find Aircraft or Flight No"
        />
        <p-inputIcon styleClass="pi pi-search"></p-inputIcon>
      </p-iconField>
    </div>
  </section>

  <!-- Table -->
  <section class="table-section custom-card mt-5">
    <app-custom-table
      [tableData]="flightPlansData()"
      [tableColumns]="columns()"
      [totalRecords]="flightPlansTotal()"
      (lazyLoadEvent)="lazyLoadEvent($event)"
      [tableLoading]="tableLoading()"
    ></app-custom-table>
  </section>
</div>

<!-- Flight Plan Column Template -->
<ng-template #flightPlansColumnTemplate let-rowData="rowData">
  <button
    class="border border-gray-300 rounded-md px-3 py-1 bg-white"
    (click)="onFlightPlansShow(rowData)"
  >
    Show
  </button>
</ng-template>

<!-- Status Chip Template -->
<ng-template #statusColumnTemplate let-rowData="rowData">
  <ng-container [ngSwitch]="rowData.status">
    <p-chip
      *ngSwitchCase="'SUBMITTED'"
      label="Submitted"
      class="light-green-chip"
    />
    <p-chip *ngSwitchCase="'APPROVED'" label="Approved" class="green-chip" />
    <p-chip *ngSwitchCase="'DECLINED'" label="Declined" class="red-chip" />
    <p-chip
      *ngSwitchCase="'NEW'"
      label="Waiting for approve"
      class="orange-chip"
    />
    <p-chip *ngSwitchCase="'REPLACED'" label="Replaced" class="black-chip" />
    <p-chip
      *ngSwitchDefault
      label="{{ rowData.status || '-' }}"
      class="gray-chip"
    />
  </ng-container>
</ng-template>

<!-- PDF Modal Component -->
<app-flight-plan-modal
  [visible]="displayModal()"
  [pdfData]="pdfData()"
  (visibleChange)="onModalHide()"
></app-flight-plan-modal>
