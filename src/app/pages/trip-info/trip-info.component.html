<main id="TripInfoPage">
  <section class="table-header-section lg:flex block">
    <!-- Header Title -->
    <span class="header-title">Trip Info</span>

    <!-- Filter Inputs and Dropdown -->
    <div class="grid grid-cols-10 gap-4 items-center">
      <!-- Aircraft  Input -->
      <div class="lg:col-span-2 md:col-span-6 col-span-12">
        <p-iconField iconPosition="right" class="custom-icon-field">
          <p-inputIcon styleClass="pi pi-search"></p-inputIcon>
          <input type="text" pInputText placeholder="Aircraft" />
        </p-iconField>
      </div>

      <!-- Flight No Input -->
      <div class="lg:col-span-2 md:col-span-6 col-span-12">
        <p-iconField iconPosition="right" class="custom-icon-field">
          <p-inputIcon styleClass="pi pi-search"></p-inputIcon>
          <input type="text" pInputText placeholder="Flight No" />
        </p-iconField>
      </div>

      <!-- Dep Port Input -->
      <div class="lg:col-span-2 md:col-span-6 col-span-12">
        <p-iconField iconPosition="right" class="custom-icon-field">
          <p-inputIcon styleClass="pi pi-search"></p-inputIcon>
          <input type="text" pInputText placeholder="Dep Port" />
        </p-iconField>
      </div>

      <!-- Arr Port Input -->
      <div class="lg:col-span-2 md:col-span-6 col-span-12">
        <p-iconField iconPosition="right" class="custom-icon-field">
          <p-inputIcon styleClass="pi pi-search"></p-inputIcon>
          <input type="text" pInputText placeholder="Arr Port" />
        </p-iconField>
      </div>

      <!-- Calendar -->
      <div class="lg:col-span-2 md:col-span-6 col-span-12">
        <p-datepicker [(ngModel)]="dateRange" selectionMode="range" [readonlyInput]="true" dateFormat="dd/mm/yy" placeholder="Start Date - End Date" class="custom-calendar" />
      </div>
    </div>
  </section>

  <section class="table-section custom-card">
    <app-custom-table
      [tableData]="tripInfoTableData()"
      [tableColumns]="columns"
      [totalRecords]="tripInfoData()?.totalElements || 0"
      (pageEvent)="pageEvent($event)"
    ></app-custom-table>
  </section>
</main>

<!-- Table Cell Templates -->
<ng-template #previewCellBodyTemplate>
  <i class="pi pi-eye"></i>
</ng-template>

<ng-template #downloadCellBodyTemplate>
  <i class="pi pi-download"></i>
</ng-template>
