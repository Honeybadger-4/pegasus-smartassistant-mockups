<main id="TripInfoPage">
  <section class="table-header-section">
    <span class="header-title">Trip Info</span>
    <div class="w-[122px]">
      <p-calendar
        [(ngModel)]="dateRange"
        (ngModelChange)="onDateRangeChange($event)"
        selectionMode="range"
        [showIcon]="false"
        [readonlyInput]="true"
        placeholder="Start Date - End Date"
        dateFormat="dd/mm/yy"
        class="custom-calendar"
      ></p-calendar>
    </div>
  </section>

  <section class="table-section custom-card">
    <app-custom-table
      [tableData]="tripInfoTableData()"
      [tableColumns]="columns"
      [totalRecords]="tripInfoData()?.totalElements || 0"
      (pageEvent)="pageEvent($event)"
    ></app-custom-table>
  </section>
</main>

<!-- Table Cell Templates -->
<ng-template #previewCellBodyTemplate>
  <i class="pi pi-eye"></i>
</ng-template>

<ng-template #downloadCellBodyTemplate>
  <i class="pi pi-download"></i>
</ng-template>
