<div id="HomepageComponent">
  <section class="table-header-section">
    <div class="w-[122px]">
      <p-calendar
        [(ngModel)]="dateRange"
        selectionMode="range"
        [showIcon]="false"
        placeholder="Start Date - End Date"
        dateFormat="dd/mm/yy"
        class="custom-calendar"
        [readonlyInput]="true"
      ></p-calendar>
    </div>
  </section>
  <app-total-flights></app-total-flights>

  <div class="grid grid-cols-12 gap-4">
    <app-combined-charts
      class="lg:col-span-7 col-span-12"
    ></app-combined-charts>

    <app-top-alternate-routes-card
      class="lg:col-span-5 col-span-12"
    ></app-top-alternate-routes-card>
  </div>
</div>
