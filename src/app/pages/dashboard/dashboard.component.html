<main id="DashboardComponent">
  <section class="table-header-section">
    <div class="w-[122px]">
      <p-datepicker
        [(ngModel)]="dateRange"
        selectionMode="range"
        [readonlyInput]="true"
        dateFormat="dd/mm/yy"
        placeholder="Start Date - End Date"
        class="custom-calendar"
        (ngModelChange)="onDateRangeChange($event)"
      />
    </div>
  </section>

  <app-total-flights
    [totalFlightsData]="totalFlightsData()"
    [totalFlightsCardLoading]="totalFlightsCardLoading()"
  />

  <div class="grid grid-cols-12 gap-4">
    <app-top-alternate-routes-card
      [topAlternatesData]="topAlternatesData()"
      [topAlternatesCardLoading]="topAlternatesCardLoading()"
      class="lg:col-span-5 col-span-12"
    />

    <!-- <app-combined-charts
      class="lg:col-span-7 col-span-12"
    /> -->
  </div>
</main>
