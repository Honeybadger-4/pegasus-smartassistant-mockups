<div id="logbook-usage-history" class="px-4">
  <!-- Header -->
  <section class="flex items-center justify-between">
    <span class="text-lg font-medium">Logbook Usage History</span>

    <p-button
  label="Export"
  severity="secondary"
  (click)="exportPDF()"
  styleClass="!bg-[#ffb100] hover:!bg-[#e39a00] !text-white font-medium px-4 py-2 rounded-md border-none"
></p-button>

  </section>

  <!-- Type/Date  -->
  <section class="flex items-center justify-between mt-4">
    <div class="flex gap-10">
      <button
        (click)="onSelectType('DAILY')"
        [ngClass]="
          selectedType() === 'DAILY'
            ? 'font-semibold text-gray-800'
            : 'text-gray-500'
        "
      >
        Daily
      </button>

      <button
        (click)="onSelectType('WEEKLY')"
        [ngClass]="
          selectedType() === 'WEEKLY'
            ? 'font-semibold text-gray-800'
            : 'text-gray-500'
        "
      >
        Weekly
      </button>

      <button
        (click)="onSelectType('MONTHLY')"
        [ngClass]="
          selectedType() === 'MONTHLY'
            ? 'font-semibold text-gray-800'
            : 'text-gray-500'
        "
      >
        Monthly
      </button>
    </div>

    <div class="flex gap-3 items-center">
      <p-date-picker
        [(ngModel)]="dateRange"
        (ngModelChange)="onDateRangeChange()"
        selectionMode="range"
        placeholder="Start Date - End Date"
        [readonlyInput]="true"
        dateFormat="dd/mm/yy"
        [showIcon]="true"
      ></p-date-picker>
    </div>
  </section>

  <!-- Pdf Export -->
  <div id="pdf-export-area">
    <!-- Chart -->
    <section class="card mt-5">
      <span class="font-medium block mb-3">{{ chartTitle() }}</span>

      <app-custom-line-chart
        [data]="chartData()"
        [options]="chartOptions()"
      ></app-custom-line-chart>
    </section>

    <!-- Table -->
    <span class="text-lg font-medium">History</span>
    <section class="table-section custom-card mt-5">

      <app-custom-table
        [tableData]="tableData()"
        [tableColumns]="columns()"
        [tableLoading]="tableLoading()"
        [totalRecords]="totalRecords()"
        (lazyLoadEvent)="lazyLoadEvent($event)"
      ></app-custom-table>
    </section>
  </div>
</div>
