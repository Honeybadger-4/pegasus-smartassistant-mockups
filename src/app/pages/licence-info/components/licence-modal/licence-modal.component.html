<div id="licence-modal">
  <p-dialog
  
    [(visible)]="visible"
    [modal]="true"
    [closable]="true"
    [dismissableMask]="true"
    header="Licences"
    [style]="{ width: '1200px' }"
    (onHide)="closeModal()"
  >
    <section class="table-section custom-card mt-5">
      <app-custom-table
        [tableData]="licenceModalData"
        [tableColumns]="licenceModalColumns"
      ></app-custom-table>
    </section>
  </p-dialog>
</div>
