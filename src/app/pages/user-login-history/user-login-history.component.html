<div id="user-login-history-page">
  <!-- Page Header -->
  <section class="flex items-center justify-between">
    <p class="header-title">User Login History</p>
  </section>

  <!-- Table -->
  <section class="table-section custom-card mt-5">
    <app-custom-table
      [tableData]="userLoginHistoryContentData()"
      [tableColumns]="columns()"
      [totalRecords]="userLoginHistoryData()?.totalElements || 0"
      [tableLoading]="tableLoading()"
      (lazyLoadEvent)="lazyLoadEvent($event)"
    ></app-custom-table>
  </section>
</div>
