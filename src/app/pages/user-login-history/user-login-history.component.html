<main id="UserLoginHistoryPage">
  <section class="table-header-section">
    <span class="header-title">User Login History</span>
    <p-dropdown
      [options]="periodOptions"
      [(ngModel)]="selectedPeriod"
      optionLabel="label"
      optionValue="value"
      class="custom-dropdown period-dropdown"
      placeholder="Daily"
    ></p-dropdown>
  </section>

  <section class="table-section custom-card">
    <app-custom-table [tableData]="userLoginHistoryData" [tableColumns]="columns"></app-custom-table>
  </section>
</main>
